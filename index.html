<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Calculadora de desconto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="etiqueta">
    <span class="furo" aria-hidden="true"></span>
    <h1>Calculadora de desconto</h1>
    <p class="sub">Descubra quanto você paga depois do desconto.</p>
        <form id="form" novalidate>
      <div class="campo">
        <label for="preco">Preço original (R$)</label>
        <input id="preco" type="number" min="0" step="0.01" placeholder="199,90" />
      </div>
      <div class="campo">
        <label for="percentual">Percentual de desconto</label>
        <input id="percentual" type="number" min="0" max="100" step="0.1" placeholder="15" />
      </div>
      <button type="submit">Calcular desconto</button>
      <p class="erro" id="erro" hidden></p>
    </form>
        <section class="resultado" id="resultado" hidden>
      <p class="desconto-aplicado">Desconto de <span id="percentual-aplicado"></span></p>
      <p class="preco-antigo">De <span id="preco-original"></span></p>
      <p class="valor-final" id="valor-final"></p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
